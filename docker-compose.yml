# Entorno local completo: Mongo + API. Un solo comando para levantar todo:
# docker compose up --build
services:

  mongo:
    image: mongo:7
    container_name: franchise-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # La API no arranca hasta que Mongo responde de verdad.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    container_name: franchise-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Dentro de la red de compose, el host de Mongo es el nombre del servicio.
      MONGODB_URI: mongodb://mongo:27017/franchisedb
      SERVER_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

volumes:
  mongo-data:
