# Blueprint de Render: describe el servicio como codigo en lugar de configurarlo
# a mano en el panel, de modo que el despliegue sea reproducible.
services:
  - type: web
    name: franchise-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile

    # Render espera esta ruta con 200 para dar el despliegue por bueno.
    healthCheckPath: /actuator/health

    envVars:
      # sync: false -> el valor NO vive en el repositorio; se define una sola vez
      # en el panel de Render porque contiene las credenciales de Atlas.
      - key: MONGODB_URI
        sync: false
      - key: LOG_LEVEL
        value: INFO
